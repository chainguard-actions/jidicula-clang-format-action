name: docker-clang-format

on:
  push:
    branches:
      - 'main'
    paths:
      - 'clang-format-docker/**'
      - '.github/workflows/clang-format-image.yml'
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *' # Daily at 04:05

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: clang-format

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: clang-format ${{ matrix.version-pair.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version-pair:
          - {version: "22", ubuntu: "resolute"}
          - {version: "21", ubuntu: "questing"}
          - {version: "20", ubuntu: "questing"}
          - {version: "19", ubuntu: "questing"}
          - {version: "18", ubuntu: "questing"}
          - {version: "17", ubuntu: "questing"}
          - {version: "16", ubuntu: "noble"}
          - {version: "15", ubuntu: "noble"}
          - {version: "14", ubuntu: "noble"}
          - {version: "13", ubuntu: "jammy"}
          - {version: "12", ubuntu: "jammy"}
          - {version: "11", ubuntu: "jammy"}
          - {version: "10", ubuntu: "focal"}
          - {version: "9", ubuntu: "focal"}
          - {version: "8", ubuntu: "focal"}
          - {version: "7", ubuntu: "focal"}
          - {version: "6.0", ubuntu: "focal"}
          - {version: "5.0", ubuntu: "bionic"}
          - {version: "4.0", ubuntu: "bionic"}
          - {version: "3.9", ubuntu: "bionic"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parse version tags
        env:
          VERSION: ${{ matrix.version-pair.version }}
        run: |
          safe_version=$(printf '%s' "$VERSION" | tr -d '\n\r')
          MAJOR_VERSION="${safe_version%%.*}"
          safe_major=$(printf '%s' "$MAJOR_VERSION" | tr -d '\n\r')
          echo "MAJOR_VERSION=$safe_major" >> "$GITHUB_ENV"
      - name: Log in to the Container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            maintainer=jidicula
            org.opencontainers.image.title="clang-format"
            org.opencontainers.image.description="clang-format, packaged in a Dockerfile"
            org.opencontainers.image.licenses=MIT
      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: "clang-format-docker/Dockerfile"
          push: true
          provenance: false
          tags: ${{ env.REGISTRY}}/jidicula/${{ env.IMAGE_NAME}}:${{ env.MAJOR_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "UBUNTU_VERSION=${{ matrix.version-pair.ubuntu }}"
            "CLANG_FORMAT_VERSION=${{ matrix.version-pair.version }}"
  clean-untagged-images:
    needs: publish-image
    name: Clean untagged images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '^1.22'
          check-latest: true
      - name: Install ghcr-cleaner
        run: go install github.com/jidicula/ghcr-cleaner@latest
      - name: Run ghcr-cleaner
        env:
          GHCR_DELETE_TOKEN: ${{ secrets.GHCR_DELETE_TOKEN }}
        run: ghcr-cleaner --token "$GHCR_DELETE_TOKEN" --packagename clang-format
