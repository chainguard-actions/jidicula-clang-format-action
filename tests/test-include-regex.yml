name: Test include-regex - only check files matching custom regex
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock docker on PATH
        run: |
          mkdir -p "$HOME/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker-pass/docker" "$HOME/bin/docker"
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run clang-format check with include-regex matching only .c files
        id: action
        uses: .
        with:
          clang-format-version: '18'
          check-path: 'tests/fixtures/mixed'
          fallback-style: 'llvm'
          include-regex: '^.*\.c$'

      - name: Assert action passed (only .c files checked, .h file excluded)
        run: |
          echo "PASS: clang-format check passed because only .c files were checked via include-regex"
