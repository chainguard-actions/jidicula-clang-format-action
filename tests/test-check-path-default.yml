name: Test check-path default - explicit path with properly formatted code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock docker on PATH
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker.sh" "$GITHUB_WORKSPACE/tests/bin/docker"
          chmod +x "$GITHUB_WORKSPACE/tests/bin/docker"
          echo "$GITHUB_WORKSPACE/tests/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          clang-format-version: '18'
          check-path: 'tests/fixtures/checkpath-test'
          fallback-style: 'llvm'

      - name: Assert action succeeded with explicit check-path
        run: |
          echo "PASS: clang-format check passed with explicit check-path pointing to properly formatted files"
