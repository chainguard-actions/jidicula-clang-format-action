name: Test clang-format check with exclude-regex skips matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install clang-format and create docker mock
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          # Write a mock docker script that strips docker-run args and calls clang-format directly
          printf '%s\n' '#!/usr/bin/env bash' \
            'args=()' \
            'skip_next=false' \
            'found_image=false' \
            'for arg in "$@"; do' \
            '  if $skip_next; then skip_next=false; continue; fi' \
            '  case "$arg" in' \
            '    run) continue ;;' \
            '    --volume|-v|--workdir|-w|--entrypoint) skip_next=true; continue ;;' \
            '    ghcr.io/jidicula/clang-format:*) found_image=true; continue ;;' \
            '    /bin/bash) continue ;;' \
            '    *) if $found_image; then args+=("$arg"); fi ;;' \
            '  esac' \
            'done' \
            'exec clang-format "${args[@]}"' \
            | sudo tee /usr/local/bin/docker > /dev/null
          sudo chmod +x /usr/local/bin/docker
      - name: Run clang-format check with exclude-regex matching all poorly-formatted files
        id: action
        uses: .
        with:
          clang-format-version: '18'
          check-path: tests/fixtures/fail
          fallback-style: 'llvm'
          exclude-regex: 'fixtures/fail'
      - name: Assert action passed because all files were excluded
        run: |
          echo "PASS: clang-format check succeeded because all poorly-formatted files were excluded by regex"
