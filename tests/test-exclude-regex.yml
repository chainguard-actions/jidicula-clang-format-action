name: Test exclude-regex - excluded badly-formatted file is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock docker on PATH
        run: |
          mkdir -p "$HOME/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker-pass/docker" "$HOME/bin/docker"
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run clang-format check with exclude-regex matching vendor dir
        id: action
        uses: .
        with:
          clang-format-version: '18'
          check-path: 'tests/fixtures/checkdir'
          fallback-style: 'llvm'
          exclude-regex: 'vendor'

      - name: Assert action passed (excluded file was skipped)
        run: |
          echo "PASS: clang-format check passed because badly-formatted file was excluded"
