name: Test fail - improperly formatted code is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock docker on PATH
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker.sh" "$GITHUB_WORKSPACE/tests/bin/docker"
          chmod +x "$GITHUB_WORKSPACE/tests/bin/docker"
          echo "$GITHUB_WORKSPACE/tests/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          clang-format-version: '18'
          check-path: 'tests/fixtures/fail-code'
          fallback-style: 'llvm'
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on improperly formatted code, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected formatting issues"
