name: Test no source files - action passes when no C/C++ files found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock docker on PATH
        run: |
          mkdir -p "$HOME/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker-pass/docker" "$HOME/bin/docker"
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run clang-format check on directory with no C/C++ files
        id: action
        uses: .
        with:
          clang-format-version: '18'
          check-path: 'tests/fixtures/scripts'
          fallback-style: 'llvm'

      - name: Assert action passed (no source files to check)
        run: |
          echo "PASS: clang-format check passed because no C/C++ source files were found"
