name: "clang-format Check"
description: "Use clang-format to see if your C/C++/Protobuf code is formatted according to project guidelines."

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  clang-format-version:
    description: 'The major version of clang-format that you want to use.'
    required: false
    default: '22'
  check-path:
    description: 'The path to the directory you want to check for correct C/C++/Protobuf formatting. Default is the full repository.'
    required: false
    default: '.'
  exclude-regex:
    description: 'A regex to exclude files or directories that should not be checked. Default is empty.'
    required: false
    default: ''
  fallback-style:
    description: 'The fallback style for clang-format if no .clang-format file exists in your repository.'
    required: false
    default: 'llvm'
  include-regex:
    description: 'A regex to override the C/C++/Protobuf/CUDA filetype regex. that should be checked. Default results in the regex defined in `check.sh`.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - env:
        ACTION_PATH: ${{ github.action_path }}
        CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        CHECK_PATH: ${{ inputs.check-path }}
        FALLBACK_STYLE: ${{ inputs.fallback-style }}
        EXCLUDE_REGEX: ${{ inputs.exclude-regex }}
        INCLUDE_REGEX: ${{ inputs.include-regex }}
      run: |
        "$ACTION_PATH/check.sh" "$CLANG_FORMAT_VERSION" "$CHECK_PATH" "$FALLBACK_STYLE" "$EXCLUDE_REGEX" "$INCLUDE_REGEX"
      shell: bash
    - name: Save PR head commit SHA
      if: failure() && github.event_name == 'pull_request'
      shell: bash
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        safe_sha=$(printf '%s' "$PR_HEAD_SHA" | tr -d '\n\r')
        echo "SHA=$safe_sha" >> "$GITHUB_ENV"
    - name: Save latest commit SHA if not PR
      if: failure() && github.event_name != 'pull_request'
      shell: bash
      env:
        COMMIT_SHA: ${{ github.sha }}
      run: |
        safe_sha=$(printf '%s' "$COMMIT_SHA" | tr -d '\n\r')
        echo "SHA=$safe_sha" >> "$GITHUB_ENV"

    - name: Report failure in job summary
      if: failure()
      run: |
        DEEPLINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA"
        echo -e "Format check failed on commit [${GITHUB_SHA:0:8}]($DEEPLINK) with files:\n$(<"$GITHUB_WORKSPACE/failing-files.txt")" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
